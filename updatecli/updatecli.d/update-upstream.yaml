---
name: Update upstream version

sources:
  tag:
    name: Get upstream release
    kind: githubrelease
    spec:
      owner: '{{ .scm.upstream.owner }}'
      repository: '{{ .scm.upstream.repository }}'
      token: '{{ requiredEnv .github.token }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: semver

targets:
  tagfile:
    name: "Bump to latest metrics-server version in TAG"
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: TAG
      matchpattern: '(?m)^(.+)$'
      replacepattern: '{{ source "tag" }}'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ .scm.default.owner }}'
      repository: '{{ .scm.default.repository }}'
      branch: '{{ .scm.default.branch }}'

actions:
  default:
    title: 'Bump to upstream version {{ source "tag" }}'
    kind: github/pullrequest
    spec:
      merge:
        strategy: auto
      mergemethod: squash
      labels:
        - chore
        - skip-changelog
        - status/auto-created
    scmid: default
